<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lignée — démo de la scène</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/scene.css">
  <style>
    .demo { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 16px 18px; }
    .demo h2 { color: var(--accent); margin: 0 0 4px; }
    .ctrl { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px 18px; align-items: end; }
    .ctrl label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
    .ctrl label.toggle { flex-direction: row; align-items: center; color: var(--text); }
    .ctrl input[type=range] { accent-color: var(--accent); }
    #etat { font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
  </style>
</head>
<body>
  <div class="demo">
    <h2>Démo de la scène</h2>
    <p class="muted small">Faux état de jeu : rien n'est sauvegardé. Depuis la console, <code>G</code> se modifie directement (ex. <code>G.currentJob = 'artisan'</code>).</p>

    <div id="scene" aria-hidden="true"></div>

    <div class="card ctrl">
      <label>Métier <select id="job"></select></label>
      <label>Compétence <select id="skill"></select></label>
      <label>Âge : <b id="ageTxt"></b><input type="range" id="age" min="14" max="100" step="0.5"></label>
      <label>Espérance de vie : <b id="lifeTxt"></b><input type="range" id="life" min="40" max="150"></label>
      <label>Corruption : <b id="corrTxt"></b><input type="range" id="corr" min="0" max="100"></label>
      <label class="toggle"><input type="checkbox" id="pause"> Pause</label>
      <label class="toggle"><input type="checkbox" id="dead"> Mort</label>
      <div class="row-btns">
        <button class="btn small" id="jobUp">Métier niv. +1</button>
        <button class="btn small" id="skillUp">Compétence niv. +1</button>
        <button class="btn small" id="newLife">Nouvelle vie</button>
      </div>
    </div>
    <p class="muted" id="etat"></p>
  </div>

  <script src="../js/data.js"></script>
  <script>
    'use strict';
    // Faux état : seulement ce que lit js/scene.js.
    const SKILL_BY_ID = Object.fromEntries(SKILLS.map(s => [s.id, s]));
    const niveaux = ids => Object.fromEntries(ids.map(id => [id, { level: 0 }]));
    let G = {
      currentJob: 'artisan', currentSkill: 'discipline',
      jobs: niveaux(JOBS.map(j => j.id)), skills: niveaux([...SKILLS.map(s => s.id), 'inconnu']),
      paused: false, dead: false, corruption: 0, days: 30 * DAYS_PER_YEAR, demoLifespan: 70,
    };
    const ageYears = () => G.days / DAYS_PER_YEAR;
    const lifespanYears = () => G.demoLifespan;

    const $ = id => document.getElementById(id);
    const options = (sel, groups) => {
      for (const [label, items] of groups) {
        const g = document.createElement('optgroup'); g.label = label;
        for (const [value, text] of items) g.append(new Option(text, value));
        sel.append(g);
      }
    };
    options($('job'), Object.entries(JOB_CATS).map(([cat, c]) => [c.name, JOBS.filter(j => j.cat === cat).map(j => [j.id, j.name])]));
    options($('skill'), [...Object.entries(SKILL_CATS).map(([cat, c]) => [c.name, SKILLS.filter(s => s.cat === cat).map(s => [s.id, s.name])]), ['Test', [['inconnu', 'Compétence inconnue']]]]);

    $('job').onchange = e => { G.currentJob = e.target.value; };
    $('skill').onchange = e => { G.currentSkill = e.target.value; };
    $('age').oninput = e => { G.days = +e.target.value * DAYS_PER_YEAR; };
    $('life').oninput = e => { G.demoLifespan = +e.target.value; };
    $('corr').oninput = e => { G.corruption = +e.target.value; };
    $('pause').onchange = e => { G.paused = e.target.checked; };
    $('dead').onchange = e => { G.dead = e.target.checked; };
    $('jobUp').onclick = () => { G.jobs[G.currentJob].level++; };
    $('skillUp').onclick = () => { G.skills[G.currentSkill].level++; };
    $('newLife').onclick = () => {
      for (const e of [...Object.values(G.jobs), ...Object.values(G.skills)]) e.level = 0;
      G.days = 14 * DAYS_PER_YEAR; G.corruption = 0;
    };

    // Les contrôles suivent G (utile quand on le modifie depuis la console).
    setInterval(() => {
      $('job').value = G.currentJob; $('skill').value = G.currentSkill;
      $('age').value = ageYears(); $('ageTxt').textContent = Math.floor(ageYears()) + ' ans';
      $('life').value = G.demoLifespan; $('lifeTxt').textContent = G.demoLifespan + ' ans';
      $('corr').value = G.corruption; $('corrTxt').textContent = Math.round(G.corruption);
      $('pause').checked = G.paused; $('dead').checked = G.dead;
      const d = $('scene').dataset;
      $('etat').textContent = `voie=${d.voie} geste=${d.geste} âge=${d.age} pause=${'pause' in d} corrompu=${'corrompu' in d}`
        + ` · métier niv. ${G.jobs[G.currentJob]?.level ?? '—'} · compétence niv. ${G.skills[G.currentSkill]?.level ?? '—'}`;
    }, 200);
  </script>
  <script src="../js/scene.js"></script>
</body>
</html>
