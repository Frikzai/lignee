      <!-- chaumière au loin -->
      <path class="lointain" d="M140 100 V85 H172 V100 Z M135 86 L156 71 L177 86 Z"/>
      <!-- forge et sa cheminée -->
      <ellipse cx="67" cy="94" rx="30" ry="14" fill="url(#scene-lueur)" class="forge-lueur"/>
      <path class="sil-decor" d="M38 100 V70 L80 53 L122 70 V100 Z M100 46 H110 V64 H100 Z"/>
      <rect class="feu" x="57" y="86" width="20" height="10" rx="1.5"/>
      <circle class="braise" cx="104" cy="45" r=".9"/>
      <circle class="braise" cx="106" cy="45" r=".7" style="animation-delay:-1.1s"/>
      <circle class="braise" cx="103" cy="45" r=".8" style="animation-delay:-2.2s"/>
      <!-- clôture -->
      <path class="sil-decor" d="M300 100 V90 H302 V100 Z M322 100 V90 H324 V100 Z M344 100 V90 H346 V100 Z M366 100 V90 H368 V100 Z M298 92 H370 V93.4 H298 Z"/>
      <!-- moulin -->
      <path class="sil-decor" d="M392 100 L396 66 H408 L412 100 Z M393 66.5 L402 58 L411 66.5 Z"/>
      <g class="ailes">
        <path class="sil-decor" d="M401 63 H403 L404.5 38 H399.5 Z"/>
        <path class="sil-decor" d="M401 63 H403 L404.5 38 H399.5 Z" transform="rotate(90 402 63)"/>
        <path class="sil-decor" d="M401 63 H403 L404.5 38 H399.5 Z" transform="rotate(180 402 63)"/>
        <path class="sil-decor" d="M401 63 H403 L404.5 38 H399.5 Z" transform="rotate(270 402 63)"/>
      </g>
      <path class="ble" d="M0 100 V98.6 L0.0 96.8 L1.6 98.6 L3.1 96.0 L4.7 98.6 L6.2 94.8 L7.8 98.6 L9.3 97.6 L10.9 98.6 L12.4 98.7 L14.0 98.6 L15.5 96.9 L17.1 98.6 L18.6 96.6 L20.2 98.6 L21.7 95.2 L23.3 98.6 L24.8 95.8 L26.4 98.6 L27.9 98.8 L29.5 98.6 L31.0 97.8 L32.6 98.6 L34.1 96.4 L35.7 98.6 L37.2 96.1 L38.8 98.6 L40.3 95.0 L41.9 98.6 L43.4 97.5 L45.0 98.6 L46.5 98.9 L48.1 98.6 L49.6 96.8 L51.2 98.6 L52.7 96.3 L54.3 98.6 L55.8 95.5 L57.4 98.6 L58.9 95.7 L60.5 98.6 L62.0 98.8 L63.6 98.6 L65.1 98.0 L66.7 98.6 L68.2 96.1 L69.8 98.6 L71.3 96.1 L72.9 98.6 L74.4 95.2 L76.0 98.6 L77.5 97.3 L79.1 98.6 L80.6 99.1 L82.2 98.6 L83.7 96.8 L85.3 98.6 L86.8 96.0 L88.4 98.6 L89.9 95.7 L91.5 98.6 L93.0 95.8 L94.6 98.6 L96.1 98.7 L97.7 98.6 L99.2 98.3 L100.8 98.6 L102.3 95.9 L103.9 98.6 L105.4 96.0 L107.0 98.6 L108.5 95.5 L110.1 98.6 L111.6 97.1 L113.2 98.6 L114.7 99.2 L116.3 98.6 L117.8 96.8 L119.4 98.6 L120.9 95.6 L122.5 98.6 L124.0 95.9 L125.6 98.6 L127.1 95.9 L128.7 98.6 L130.2 98.5 L131.8 98.6 L133.3 98.5 L134.9 98.6 L136.4 95.7 L138.0 98.6 L139.5 95.8 L141.1 98.6 L142.6 95.9 L144.2 98.6 L145.7 96.9 L147.3 98.6 L148.8 99.2 L150.4 98.6 L151.9 97.0 L153.5 98.6 L155.0 95.3 L156.6 98.6 L158.1 96.1 L159.7 98.6 L161.2 96.1 L162.8 98.6 L164.3 98.3 L165.9 98.6 L167.4 98.6 L169.0 98.6 L170.5 95.6 L172.1 98.6 L173.6 95.6 L175.2 98.6 L176.7 96.2 L178.3 98.6 L179.8 96.9 L181.4 98.6 L182.9 99.1 L184.5 98.6 L186.0 97.2 L187.6 98.6 L189.1 95.0 L190.7 98.6 L192.2 96.1 L193.8 98.6 L195.3 96.4 L196.9 98.6 L198.4 98.0 L200.0 98.6 L201.5 98.7 L203.1 98.6 L204.6 95.6 L206.2 98.6 L207.7 95.3 L209.3 98.6 L210.8 96.5 L212.4 98.6 L213.9 96.9 L215.5 98.6 L217.0 98.9 L218.6 98.6 L220.1 97.4 L221.7 98.6 L223.2 94.8 L224.8 98.6 L226.3 96.1 L227.9 98.6 L229.4 96.7 L231.0 98.6 L232.5 97.8 L234.1 98.6 L235.6 98.7 L237.2 98.6 L238.7 95.7 L240.3 98.6 L241.8 95.1 L243.4 98.6 L244.9 96.7 L246.5 98.6 L248.0 97.0 L249.6 98.6 L251.1 98.6 L252.7 98.6 L254.2 97.6 L255.8 98.6 L257.3 94.7 L258.9 98.6 L260.4 96.0 L262.0 98.6 L263.5 97.1 L265.1 98.6 L266.6 97.6 L268.2 98.6 L269.7 98.6 L271.3 98.6 L272.8 95.9 L274.4 98.6 L275.9 94.8 L277.5 98.6 L279.0 96.9 L280.6 98.6 L282.1 97.2 L283.7 98.6 L285.2 98.3 L286.8 98.6 L288.3 97.7 L289.9 98.6 L291.4 94.7 L293.0 98.6 L294.5 95.8 L296.1 98.6 L297.6 97.4 L299.2 98.6 L300.7 97.6 L302.3 98.6 L303.8 98.4 L305.4 98.6 L306.9 96.1 L308.5 98.6 L310.0 94.6 L311.6 98.6 L313.1 97.0 L314.7 98.6 L316.2 97.5 L317.8 98.6 L319.3 98.0 L320.9 98.6 L322.4 97.7 L324.0 98.6 L325.5 94.8 L327.1 98.6 L328.6 95.6 L330.2 98.6 L331.7 97.7 L333.3 98.6 L334.8 97.6 L336.4 98.6 L337.9 98.2 L339.5 98.6 L341.0 96.3 L342.6 98.6 L344.1 94.5 L345.7 98.6 L347.2 97.0 L348.8 98.6 L350.3 97.8 L351.9 98.6 L353.4 97.7 L355.0 98.6 L356.5 97.7 L358.1 98.6 L359.6 94.9 L361.2 98.6 L362.7 95.3 L364.3 98.6 L365.8 97.9 L367.4 98.6 L368.9 97.7 L370.5 98.6 L372.0 97.9 L373.6 98.6 L375.1 96.5 L376.7 98.6 L378.2 94.4 L379.8 98.6 L381.3 96.8 L382.9 98.6 L384.4 98.2 L386.0 98.6 L387.5 97.5 L389.1 98.6 L390.6 97.5 L392.2 98.6 L393.7 95.1 L395.3 98.6 L396.8 95.1 L398.4 98.6 L399.9 98.1 L401.5 98.6 L403.0 97.8 L404.6 98.6 L406.1 97.5 L407.7 98.6 L409.2 96.6 L410.8 98.6 L412.3 94.5 L413.9 98.6 L415.4 96.7 L417.0 98.6 L418.5 98.5 L420.1 98.6 L421.6 97.4 L423.2 98.6 L424.7 97.3 L426.3 98.6 L427.8 95.4 L429.4 98.6 L430.9 95.0 L432.5 98.6 L434.0 98.1 L435.6 98.6 L437.1 98.1 L438.7 98.6 L440.2 97.2 L441.8 98.6 L443.3 96.6 L444.9 98.6 L446.4 94.6 L448.0 98.6 L449.5 96.5 L451.1 98.6 L452.6 98.7 L454.2 98.6 L455.7 97.4 L457.3 98.6 L458.8 97.0 L460.4 98.6 L461.9 95.6 L463.5 98.6 L465.0 95.0 L466.6 98.6 L468.1 98.1 L469.7 98.6 L471.2 98.4 L472.8 98.6 L474.3 96.9 L475.9 98.6 L477.4 96.5 L479.0 98.6 L480 98.6 V100 Z"/>
    </g>
  </g>

  <rect class="sol" y="100" width="480" height="10"/>

  <g id="elements">
    <!-- Artisan : enclume (le marteau la frappe vers 241,82) -->
    <g class="element" data-element="enclume">
      <path class="sil-decor" d="M233 82.6 H266 V86 L258 87.2 L255 93 L262 100 H238 L245 93 L242 87.2 L236.5 86.2 Q229 85.6 228 83.4 Z"/>
      <rect class="metal" x="237.5" y="80.6" width="9" height="2.2" rx=".8"/>
    </g>
    <!-- Mineur : paroi rocheuse et son filon -->
    <g class="element" data-element="paroi">
      <path class="sil-decor" d="M310 100 V46 L270 50 L256 58 L249 68 L242.5 79 L244.5 88 L240.5 100 Z"/>
      <path class="filon" d="M246 76 L256 72 L266 75 L276 70 M248 86 L258 84 L268 87"/>
    </g>
    <!-- Glaneur : gerbes de blé (la main se pose vers 235,86) -->
    <g class="element" data-element="gerbes">
      <path class="sil-decor" d="M232 100 L234.5 93 L233 87 L237 89.5 L238.5 86.4 L240 89.5 L244 87 L242.5 93 L245 100 Z"/>
      <path class="sil-decor" d="M247 100 L249 94.5 L247.8 90 L251 92 L252.2 89.5 L253.4 92 L256.6 90 L255.4 94.5 L257.4 100 Z"/>
      <path class="ble-epis" d="M259 100 L262 95 M262 100 L263.5 94.6 M265 100 L264.6 95.4"/>
    </g>
    <!-- Bûcheron : billot et bûche (la hache tombe vers 244,82) -->
    <g class="element" data-element="billot">
      <path class="sil-decor" d="M236 100 V89.5 Q246 86.6 256 89.5 V100 Z"/>
      <rect class="sil-decor" x="240.5" y="81" width="7" height="8" rx=".6"/>
    </g>
    <!-- Pêcheur : rivière (le bouchon touche l'eau vers 265,96) -->
    <g class="element" data-element="riviere">
      <path class="eau" d="M236 100 Q238 95.6 244 95.4 H480 V100 Z"/>
      <path class="reflets" d="M250 97.4 H262 M274 98.4 H290 M300 97 H309 M322 98.2 H340 M356 97.4 H366"/>
    </g>
    <!-- Négociant : étal et sa toile -->
    <g class="element" data-element="etal">
      <path class="sil-decor" d="M240 85 H283 V87.2 H240 Z M242 87 H244 V100 H242 Z M279 87 H281 V100 H279 Z M241 62 H242.4 V85 H241 Z M281 62 H282.4 V85 H281 Z"/>
      <path class="toile" d="M238 61 H285 L284 66 Q281 68.4 278 66 Q275 68.4 272 66 Q269 68.4 266 66 Q263 68.4 260 66 Q257 68.4 254 66 Q251 68.4 248 66 Q245 68.4 242 66 Q240 67.4 239 66 Z"/>
      <path class="sil-decor" d="M248 85 V80.5 Q250 78.6 252 80.5 V85 Z M256 85 V79 H263 V85 Z M268 85 Q266.4 80 271 79.6 Q275.6 80 274 85 Z"/>
    </g>
  </g>

  <!-- derrière le personnage : fumée de corruption et halo de montée de niveau -->
  <g class="fumee" filter="url(#scene-flou)">
    <ellipse class="volute" cx="210" cy="96" rx="7" ry="4"/>
    <ellipse class="volute" cx="226" cy="98" rx="8" ry="4.5" style="animation-delay:-1.3s"/>
    <ellipse class="volute" cx="216" cy="99" rx="6" ry="3.5" style="animation-delay:-2.6s"/>
    <ellipse class="volute" cx="232" cy="95" rx="6.5" ry="4" style="animation-delay:-3.8s"/>
  </g>
  <ellipse class="halo" cx="220" cy="72" rx="28" ry="32" fill="url(#scene-halo)"/>

  <g id="perso" class="sil">
    <g class="jambe-arriere"><path d="M216.2 76 H219.8 L218.4 98 L219.8 98.6 V100 H214.8 L215 98 Z"/></g>
    <g class="jambe-avant"><path d="M220.2 76 H223.8 L223.2 98 L225.4 98.6 V100 H220.4 V98 Z"/></g>
    <g class="haut">
      <g class="bras-arriere">
        <path class="membre" d="M216 59 V69" stroke-width="3.4"/>
        <g class="avant-bras-arriere">
          <path class="membre" d="M216 69 V77.4" stroke-width="3"/>
          <g class="main-arriere">
            <circle cx="216" cy="78" r="1.7"/>
            <g class="objet" data-objet="panier">
              <path class="manche" d="M212.4 81 Q216 75.6 219.6 81"/>
              <path d="M211.2 81 H220.8 L219.6 87.4 H212.4 Z"/>
            </g>
          </g>
        </g>
      </g>
      <g class="torse">
        <path d="M215.6 59.6 Q220 56.6 224.4 59.6 L223.8 70 L225.6 80 H214.4 L216.2 70 Z"/>
        <!-- bourse portée à la ceinture -->
        <g class="objet" data-objet="bourse"><path d="M224.6 73.4 Q229.4 73.4 228.8 78.6 Q226.8 80.6 224.6 78.6 Z"/></g>
      </g>
      <g class="tete">
        <rect x="218.7" y="54" width="2.6" height="4.5"/>
        <path d="M220 44.4 A5.6 5.6 0 1 1 219.9 55.6 A5.6 5.6 0 0 1 220 44.4 Z M225.2 49.2 L226.8 51.2 L225.2 51.8 Z"/>
        <g class="barbe"><path d="M221.6 53 L226.6 55.4 Q225 60.2 220.4 59.2 Z"/></g>
        <g class="yeux"><circle class="yeux-halo" cx="223.4" cy="49.2" r="2"/><circle class="yeux-oeil" cx="223.4" cy="49.2" r=".8"/></g>
      </g>
      <g class="bras-avant">
        <path class="membre" d="M224 59 V69" stroke-width="3.4"/>
        <g class="avant-bras-avant">
          <path class="membre" d="M224 69 V77.4" stroke-width="3"/>
          <g class="main-avant">
            <circle cx="224" cy="78" r="1.7"/>
            <g class="objet" data-objet="marteau">
              <path class="manche" d="M224 78 V88.5"/>
              <rect x="220.4" y="87.6" width="7.2" height="3.8" rx=".5"/>
            </g>
            <!-- tranchant vers l'arrière en pose de référence : il fait face au coup quand la hache s'abat -->
            <g class="objet" data-objet="hache">
              <path class="manche" d="M224 78 V90.5"/>
              <path d="M224.6 87.6 L218.6 85.6 Q217 89.2 218.6 92.6 L224.6 90.6 Z M224 88 H226.2 V90.2 H224 Z"/>
            </g>
            <!-- canne : le fil est tracé pour pendre à la verticale quand la canne est à -115° (pose d'attente) -->
            <g class="objet" data-objet="canne">
              <path class="manche" d="M224 78 V104"/>
              <path class="fil" d="M224 104 L185.0 85.8"/>
              <g class="bouchon"><circle cx="185.0" cy="85.8" r="1.1"/></g>
            </g>
            <g class="objet" data-objet="pioche">
              <path class="manche" d="M224 78 V90"/>
              <path d="M215.5 89 Q224 85.6 232.5 89 L232.8 90.4 Q224 88 215.2 90.4 Z"/>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>

  <g id="effets">
    <g class="ronds" transform="translate(265 96.4)">
      <ellipse rx="3" ry=".8"/><ellipse rx="3" ry=".8" style="animation-delay:.25s"/>
    </g>
    <g class="pieces" transform="translate(229.4 66)">
      <circle r="1.1"/><circle r="1.1" style="animation-delay:-.9s"/>
    </g>
    <g class="copeaux" transform="translate(244 82)">
      <rect width="1.6" height=".8" style="--dx:-10px;--dy:-9px"/><rect width="1.2" height=".7" style="--dx:9px;--dy:-11px"/>
      <rect width="1.4" height=".8" style="--dx:13px;--dy:-3px"/><rect width="1.1" height=".6" style="--dx:-13px;--dy:-2px"/>
    </g>
    <g class="impact" transform="translate(242 82)">
      <circle r=".9" style="--dx:11px;--dy:-12px"/><circle r=".7" style="--dx:-8px;--dy:-11px"/>
      <circle r=".8" style="--dx:15px;--dy:-4px"/><circle r=".6" style="--dx:-12px;--dy:-3px"/>
      <circle r=".7" style="--dx:4px;--dy:-16px"/>
    </g>
    <g class="gerbe" transform="translate(220 66)">
      <circle r=".9" style="--dx:-16px;--dy:-12px"/><circle r=".7" style="--dx:15px;--dy:-14px"/>
      <circle r=".8" style="--dx:-20px;--dy:2px"/><circle r=".9" style="--dx:19px;--dy:-1px"/>
      <circle r=".7" style="--dx:-9px;--dy:-20px"/><circle r=".8" style="--dx:8px;--dy:-21px"/>
      <circle r=".6" style="--dx:-14px;--dy:12px"/><circle r=".7" style="--dx:13px;--dy:11px"/>
    </g>
  </g>

</svg>
