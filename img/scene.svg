<svg xmlns="http://www.w3.org/2000/svg" class="scene-svg" viewBox="0 0 480 110" preserveAspectRatio="xMidYMax slice">
  <!--
    Théâtre de la scène animée (voir docs/specs/2026-11-24-direction-artistique-et-scene.md §4.2).
    Repères : sol y=100 · zone sûre x∈[90,390] y∈[38,110] · personnage centré x=220 · éléments x∈[236,330].
    Pivots (transform-origin dans css/scene.css) :
      #perso 220,100 · .haut 220,76 · .tete 220,56
      .jambe-avant 222,76 · .jambe-arriere 218,76
      .bras-avant 224,59 · .avant-bras-avant 224,69 · .main-avant 224,78
      .bras-arriere 216,59 · .avant-bras-arriere 216,69 · .main-arriere 216,78
    Pose de référence : debout, bras pendants. Les objets sont dessinés tenus dans .main-avant (ou .main-arriere).
    Couleurs : uniquement via les classes / variables CSS (--sil, --ciel-haut…).
  -->
  <defs>
    <linearGradient id="scene-ciel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" class="ciel-haut"/>
      <stop offset="1" class="ciel-bas"/>
    </linearGradient>
    <radialGradient id="scene-lueur" cx=".5" cy=".5" r=".5">
      <stop offset="0" class="lueur-coeur"/>
      <stop offset="1" class="lueur-bord"/>
    </radialGradient>
    <radialGradient id="scene-halo">
      <stop offset="0" class="halo-coeur"/>
      <stop offset="1" class="halo-bord"/>
    </radialGradient>
    <filter id="scene-flou" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.6"/></filter>
  </defs>

  <g id="ciel">
    <rect width="480" height="110" fill="url(#scene-ciel)"/>
    <circle class="lune" cx="398" cy="42" r="7"/>
    <!-- lueur d'horizon derrière le personnage : garde la silhouette lisible -->
    <ellipse cx="230" cy="100" rx="200" ry="46" fill="url(#scene-lueur)"/>
  </g>

  <g id="decors">
    <g class="decor" data-voie="neutre">
      <path class="lointain" d="M0 100 V91 Q40 85 80 89 T170 88 T260 92 T350 86 T430 90 T480 87 V100 Z"/>
    </g>
    <g class="decor" data-voie="paysannerie">
