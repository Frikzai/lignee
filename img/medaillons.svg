<svg xmlns="http://www.w3.org/2000/svg" class="medaillon-svg" viewBox="0 0 40 40">
  <!--
    Médaillons de compétence (voir docs/specs/2026-11-24-direction-artistique-et-scene.md §4.3).
    Un <g class="med" data-skill="<id>"> par compétence. Sans icône, js/scene.js affiche l'initiale (.med-initiale).
    Animations : uniquement transform / opacity, définies dans css/scene.css.
  -->
  <circle class="med-fond" cx="20" cy="20" r="18.5"/>
  <text class="med-initiale" x="20" y="26.5" text-anchor="middle"></text>

  <!-- Discipline : bougie dont la flamme vacille -->
  <g class="med" data-skill="discipline">
    <rect class="encre" x="17" y="21" width="6" height="11" rx="1"/>
    <rect class="encre" x="14" y="31.5" width="12" height="2" rx="1"/>
    <path class="trait" d="M20 21 V18.8" stroke-width=".8"/>
    <path class="flamme" d="M20 10 Q23.5 15 21.6 18 Q20 19.6 18.4 18 Q16.5 15 20 10 Z"/>
  </g>

  <!-- Assiduité : sablier qui se retourne -->
  <g class="med" data-skill="assiduite">
    <g class="sablier">
      <path class="encre" d="M13 10 H27 V11.5 H13 Z M13 28.5 H27 V30 H13 Z"/>
      <path class="trait" d="M15 11.5 H25 Q25 17 20.8 20 Q25 23 25 28.5 H15 Q15 23 19.2 20 Q15 17 15 11.5 Z" stroke-width="1"/>
      <path class="sable" d="M16.6 13 H23.4 Q22.8 16.5 20 18.6 Q17.2 16.5 16.6 13 Z"/>
      <path class="sable" d="M17 27.6 Q20 23.5 23 27.6 Z"/>
    </g>
  </g>

  <!-- Labeur : faucille qui balance -->
  <g class="med" data-skill="labeur">
    <g class="faucille">
      <path class="trait" d="M15 31 L19 25" stroke-width="2.4" stroke-linecap="round"/>
      <path class="encre" d="M19 25 Q31 22 27 11 Q24 9 22 10.5 Q27 13 25.5 19 Q23.5 23.5 18.6 23.8 Z"/>
    </g>
  </g>

  <!-- Négoce : pièce qui tourne -->
  <g class="med" data-skill="negoce">
    <g class="piece">
      <circle class="or" cx="20" cy="20" r="8"/>
      <circle class="or-creux" cx="20" cy="20" r="5.8"/>
      <path class="or-motif" d="M20 15.6 L21.2 19 H24.6 L21.8 21 L22.8 24.4 L20 22.3 L17.2 24.4 L18.2 21 L15.4 19 H18.8 Z"/>
    </g>
  </g>

  <!-- Force : poing qui frappe -->
  <g class="med" data-skill="force">
    <g class="poing">
      <path class="encre" d="M13 17.4 Q13 13 16.4 13 H24 Q27.4 13 27.4 16.6 V24.4 Q27.4 29.4 22.4 29.4 H17.4 Q13 29.4 13 25 Z"/>
      <path class="creux" d="M17.4 13.4 V19 M20.8 13.4 V19 M24.2 13.4 V19 M13.4 21.4 H19.6 Q21 21.4 21 23.4"/>
    </g>
  </g>

  <!-- Tactique : le pion avance -->
  <g class="med" data-skill="tactique">
    <path class="trait" d="M9 30.5 H31" stroke-width=".8"/>
    <g class="pion-med">
      <circle class="encre" cx="18" cy="15" r="3"/>
      <path class="encre" d="M14.4 29.6 H21.6 V27.8 H14.4 Z M15.6 27.8 Q17 23 16.8 19 H19.2 Q19 23 20.4 27.8 Z"/>
    </g>
    <path class="sable" d="M24 17 L29 20.5 L24 24 Z"/>
  </g>

  <!-- Endurance : bouclier qui encaisse -->
  <g class="med" data-skill="endurance">
    <g class="bouclier-med">
      <path class="encre" d="M20 9 L29 12.6 V20 Q29 27.6 20 31.6 Q11 27.6 11 20 V12.6 Z"/>
      <path class="creux" d="M20 12 V28.4 M14 18.6 H26"/>
    </g>
  </g>

  <!-- Méditation : lotus et souffle qui monte -->
  <g class="med" data-skill="meditation">
    <path class="encre" d="M20 30 Q13 26.4 13.6 18.6 Q18.4 21.6 20 30 Z M20 30 Q27 26.4 26.4 18.6 Q21.6 21.6 20 30 Z M20 30 Q17 22 20 14.6 Q23 22 20 30 Z"/>
    <circle class="souffle" cx="20" cy="11" r="1.4"/>
  </g>

  <!-- Maîtrise du mana : cristal qui tourne -->
  <g class="med" data-skill="mana">
    <g class="cristal-med">
      <path class="magie" d="M20 8.6 L27 17 L20 31.4 L13 17 Z"/>
      <path class="creux" d="M13 17 H27 M20 8.6 L17.4 17 L20 31.4 L22.6 17 Z"/>
    </g>
  </g>

  <!-- Vitalité : la pousse grandit -->
  <g class="med" data-skill="vitalite">
    <path class="trait" d="M12 31 H28" stroke-width=".8"/>
    <g class="pousse">
      <path class="trait" d="M20 31 V16" stroke-width="1.4"/>
      <path class="vert" d="M20 22 Q13 22 12.6 15.6 Q19 15.4 20 22 Z M20 18.4 Q26.6 18.6 27.4 12 Q21 11.8 20 18.4 Z"/>
    </g>
  </g>

  <!-- Transmutation : le cercle tourne -->
  <g class="med" data-skill="transmutation">
    <g class="cercle-med">
      <circle class="trait" cx="20" cy="20" r="10.6" stroke-width="1"/>
      <path class="trait" d="M20 9.4 L29.2 25.3 H10.8 Z" stroke-width="1"/>
      <circle class="sable" cx="20" cy="20" r="2.4"/>
    </g>
  </g>

  <!-- Chronomancie : l'aiguille file -->
  <g class="med" data-skill="chronomancie">
    <circle class="trait" cx="20" cy="21" r="9.6" stroke-width="1.2"/>
    <path class="encre" d="M18 9 H22 V11.4 H18 Z"/>
    <path class="aiguille" d="M19.4 21 L20 13.6 L20.6 21 Z"/>
    <circle class="encre" cx="20" cy="21" r="1.2"/>
  </g>

  <!-- Discrétion : l'œil qui se ferme -->
  <g class="med" data-skill="discretion">
    <g class="paupiere">
      <path class="encre" d="M9 20 Q20 10 31 20 Q20 30 9 20 Z"/>
      <circle class="creux-plein" cx="20" cy="20" r="4"/>
      <circle class="encre" cx="20" cy="20" r="1.8"/>
    </g>
  </g>

  <!-- Cruauté : la lame qui saigne -->
  <g class="med" data-skill="cruaute">
    <path class="encre" d="M20 8 L22.2 12 V23 H17.8 V12 Z M15 23 H25 V25 H15 Z M18.8 25 H21.2 V30 H18.8 Z"/>
    <path class="sang goutte-med" d="M24.6 25.4 Q26.6 28.4 24.6 29.6 Q22.6 28.4 24.6 25.4 Z"/>
  </g>

  <!-- Magie noire : le crâne aux yeux verts -->
  <g class="med" data-skill="magienoire">
    <path class="encre" d="M12.6 19 Q12.6 10.4 20 10.4 Q27.4 10.4 27.4 19 Q27.4 22.6 25 23.8 V28.6 H15 V23.8 Q12.6 22.6 12.6 19 Z"/>
    <path class="creux" d="M18.4 28.6 V25.4 M21.6 28.6 V25.4"/>
    <circle class="vert yeux-med" cx="16.8" cy="18.6" r="2"/><circle class="vert yeux-med" cx="23.2" cy="18.6" r="2"/>
  </g>

  <!-- Pacte de sang : la goutte sur le parchemin -->
  <g class="med" data-skill="pacte">
    <path class="trait" d="M12 13 H26 Q28 13 28 15 V28 H14 Q12 28 12 26 Z M15 18 H25 M15 21 H25 M15 24 H21" stroke-width=".8"/>
    <path class="sang goutte-pacte" d="M24.4 20.6 Q28 25.4 24.4 27.8 Q20.8 25.4 24.4 20.6 Z"/>
  </g>

  <!-- Prière : cloche qui sonne -->
  <g class="med" data-skill="priere">
    <g class="cloche-med">
      <path class="trait" d="M20 13.4 V9" stroke-width="1.2"/>
      <path class="encre" d="M13 28 Q13 15 20 13.4 Q27 15 27 28 Z M11 28 H29 V30 H11 Z"/>
      <circle class="encre" cx="20" cy="31.8" r="1.8"/>
    </g>
  </g>

  <!-- Charité : une pièce tombe dans la sébile -->
  <g class="med" data-skill="charite">
    <path class="encre" d="M10 24 H30 Q29 32 20 32 Q11 32 10 24 Z"/>
    <g class="piece-tombe"><circle class="or" cx="20" cy="14" r="3.6"/><circle class="or-creux" cx="20" cy="14" r="2.4"/></g>
  </g>

  <!-- Miracles : un halo qui rayonne -->
  <g class="med" data-skill="miracles">
    <g class="rayons-med"><path class="trait" d="M20 6 V10 M20 30 V34 M6 20 H10 M30 20 H34 M10 10 L12.8 12.8 M30 30 L27.2 27.2 M30 10 L27.2 12.8 M10 30 L12.8 27.2" stroke-width="1.2"/></g>
    <circle class="trait" cx="20" cy="20" r="8" stroke-width="1.2"/>
    <circle class="or" cx="20" cy="20" r="4"/>
  </g>
</svg>
