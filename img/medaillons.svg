<svg xmlns="http://www.w3.org/2000/svg" class="medaillon-svg" viewBox="0 0 40 40">
  <!--
    Médaillons de compétence (voir docs/specs/2026-11-24-direction-artistique-et-scene.md §4.3).
    Un <g class="med" data-skill="<id>"> par compétence. Sans icône, js/scene.js affiche l'initiale (.med-initiale).
    Animations : uniquement transform / opacity, définies dans css/scene.css.
  -->
  <circle class="med-fond" cx="20" cy="20" r="18.5"/>
  <text class="med-initiale" x="20" y="26.5" text-anchor="middle"></text>

  <!-- Discipline : bougie dont la flamme vacille -->
  <g class="med" data-skill="discipline">
    <rect class="encre" x="17" y="21" width="6" height="11" rx="1"/>
    <rect class="encre" x="14" y="31.5" width="12" height="2" rx="1"/>
    <path class="trait" d="M20 21 V18.8" stroke-width=".8"/>
    <path class="flamme" d="M20 10 Q23.5 15 21.6 18 Q20 19.6 18.4 18 Q16.5 15 20 10 Z"/>
  </g>

  <!-- Assiduité : sablier qui se retourne -->
  <g class="med" data-skill="assiduite">
    <g class="sablier">
      <path class="encre" d="M13 10 H27 V11.5 H13 Z M13 28.5 H27 V30 H13 Z"/>
      <path class="trait" d="M15 11.5 H25 Q25 17 20.8 20 Q25 23 25 28.5 H15 Q15 23 19.2 20 Q15 17 15 11.5 Z" stroke-width="1"/>
      <path class="sable" d="M16.6 13 H23.4 Q22.8 16.5 20 18.6 Q17.2 16.5 16.6 13 Z"/>
      <path class="sable" d="M17 27.6 Q20 23.5 23 27.6 Z"/>
    </g>
  </g>

  <!-- Labeur : faucille qui balance -->
  <g class="med" data-skill="labeur">
    <g class="faucille">
      <path class="trait" d="M15 31 L19 25" stroke-width="2.4" stroke-linecap="round"/>
      <path class="encre" d="M19 25 Q31 22 27 11 Q24 9 22 10.5 Q27 13 25.5 19 Q23.5 23.5 18.6 23.8 Z"/>
    </g>
  </g>

  <!-- Négoce : pièce qui tourne -->
  <g class="med" data-skill="negoce">
    <g class="piece">
      <circle class="or" cx="20" cy="20" r="8"/>
      <circle class="or-creux" cx="20" cy="20" r="5.8"/>
      <path class="or-motif" d="M20 15.6 L21.2 19 H24.6 L21.8 21 L22.8 24.4 L20 22.3 L17.2 24.4 L18.2 21 L15.4 19 H18.8 Z"/>
    </g>
  </g>
</svg>
